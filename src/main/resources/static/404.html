<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Johuri.ai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#1E293B', 900: '#0F172A' },
                        pastel: { indigo: '#818CF8', mint: '#6EE7B7', amber: '#FCD34D' }
                    },
                    fontFamily: {
                        bangla: ['"Hind Siliguri"', 'sans-serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass-nav { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(129, 140, 248, 0.2); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
        .gradient-text { background: linear-gradient(135deg, #818CF8, #6EE7B7, #FCD34D); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .blob-bg { position: fixed; top: 10%; left: 25%; width: 50vw; height: 50vh; background: rgba(129, 140, 248, 0.1); filter: blur(150px); border-radius: 50%; z-index: -1; pointer-events: none; }
        .blob-bg-2 { position: fixed; bottom: 10%; right: 20%; width: 40vw; height: 40vh; background: rgba(110, 231, 183, 0.08); filter: blur(120px); border-radius: 50%; z-index: -1; pointer-events: none; }
    </style>
</head>
<body class="bg-navy-900 text-white font-sans antialiased min-h-screen flex flex-col relative overflow-x-hidden">

    <div class="blob-bg"></div>
    <div class="blob-bg-2"></div>

    <!-- Navbar -->
    <nav class="sticky top-0 w-full z-50 glass-nav py-4">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-4 group">
                <svg viewBox="0 0 48 48" class="w-10 h-10 group-hover:scale-105 transition transform" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <defs>
                        <linearGradient id="brandGradientNav" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#818CF8" />
                            <stop offset="100%" stop-color="#6EE7B7" />
                        </linearGradient>
                    </defs>
                    <g transform="translate(24, 24) rotate(-15) translate(-24, -24)">
                        <rect x="6" y="14" width="36" height="20" rx="3" fill="#0F172A" stroke="#6EE7B7" stroke-width="1.5" opacity="0.8"/>
                        <circle cx="24" cy="24" r="4" stroke="#6EE7B7" stroke-width="1.5"/>
                    </g>
                    <g transform="translate(24, 24) rotate(0) translate(-24, -24)">
                        <rect x="6" y="14" width="36" height="20" rx="3" fill="#0F172A" stroke="#818CF8" stroke-width="1.5" opacity="0.9"/>
                        <circle cx="24" cy="24" r="4" stroke="#818CF8" stroke-width="1.5"/>
                    </g>
                    <g transform="translate(24, 24) rotate(15) translate(-24, -24)">
                        <rect x="6" y="14" width="36" height="20" rx="3" fill="#0F172A" stroke="#FCD34D" stroke-width="1.5" opacity="0.9"/>
                        <circle cx="24" cy="24" r="4" stroke="#FCD34D" stroke-width="1.5"/>
                    </g>
                    <g transform="translate(6, 6) scale(1.5)">
                        <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3" fill="url(#brandGradientNav)" stroke="#0F172A" stroke-width="1"/>
                    </g>
                </svg>
                <div class="flex items-center gap-2">
                    <span class="font-bangla font-bold text-2xl tracking-wide gradient-text leading-none mt-1">জহুরী</span>
                    <span class="font-sans text-xl font-bold text-white leading-none mt-1">Johuri.ai</span>
                </div>
            </a>
            <div class="flex gap-4 items-center font-semibold text-sm">
                <a href="creators.html" class="hover:text-pastel-mint transition">Marketplace</a>
                <a href="brand-dashboard.html" class="hover:text-pastel-indigo transition">Brand Dashboard</a>
                <a href="creator-dashboard.html" class="hover:text-pastel-amber transition">Creator Studio</a>
            </div>
        </div>
    </nav>

    <!-- Error Content -->
    <main class="flex-1 flex items-center justify-center px-4 py-16 relative z-10">
        <div class="glass-card max-w-lg w-full p-8 md:p-12 rounded-[2rem] text-center border-pastel-indigo/30 shadow-2xl">
            <div class="w-20 h-20 rounded-2xl bg-pastel-indigo/20 border border-pastel-indigo/40 flex items-center justify-center mx-auto mb-6 text-pastel-indigo">
                <i data-lucide="compass" class="w-10 h-10 animate-pulse"></i>
            </div>
            
            <h1 class="text-6xl font-black gradient-text mb-2 font-mono">404</h1>
            <h2 class="text-2xl font-bold text-white mb-3">Page Not Found</h2>
            <p class="text-gray-400 text-sm mb-8 leading-relaxed">
                The page or creator resource you're looking for might have been moved, renamed, or is currently unavailable.
            </p>

            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <a href="creators.html" class="bg-gradient-to-r from-pastel-indigo to-pastel-mint text-navy-900 font-bold px-6 py-3 rounded-full hover:shadow-[0_0_20px_rgba(110,231,183,0.4)] transition flex items-center justify-center gap-2 text-sm">
                    <i data-lucide="search" class="w-4 h-4"></i>
                    <span>Explore Creators</span>
                </a>
                <a href="index.html" class="bg-navy-800 border border-white/20 text-white font-bold px-6 py-3 rounded-full hover:bg-white/10 transition flex items-center justify-center gap-2 text-sm">
                    <i data-lucide="home" class="w-4 h-4"></i>
                    <span>Return Home</span>
                </a>
            </div>
        </div>
    </main>

    <footer class="border-t border-white/10 py-6 text-center text-gray-500 text-sm relative z-10 bg-navy-900/80">
        <p>&copy; 2026 Johuri.ai. All rights reserved.</p>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
