<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Johuri.ai</title>
    <script>window.location.replace('auth.html' + window.location.search);</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#1E293B', 900: '#0F172A' },
                        pastel: { indigo: '#818CF8', mint: '#6EE7B7', amber: '#FCD34D' }
                    },
                    fontFamily: {
                        bangla: ['"Hind Siliguri"', 'sans-serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(129, 140, 248, 0.2); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); }
        .gradient-text { background: linear-gradient(135deg, #818CF8, #6EE7B7, #FCD34D); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .blob-bg { position: fixed; top: 10%; left: 10%; width: 50vw; height: 50vh; background: rgba(129, 140, 248, 0.15); filter: blur(150px); border-radius: 50%; z-index: -1; pointer-events: none; }
        .blob-bg-2 { position: fixed; bottom: 10%; right: 10%; width: 40vw; height: 40vh; background: rgba(110, 231, 183, 0.1); filter: blur(120px); border-radius: 50%; z-index: -1; pointer-events: none; }
    </style>
</head>
<body class="bg-navy-900 text-white font-sans antialiased min-h-screen flex items-center justify-center relative overflow-hidden">
    
    <div class="blob-bg"></div>
    <div class="blob-bg-2"></div>

    <div class="glass-card w-full max-w-md rounded-3xl p-8 relative z-10 m-4">
        <div class="flex flex-col items-center mb-8">
            <a href="index.html" class="flex flex-col items-center group">
                <svg viewBox="0 0 48 48" class="w-16 h-16 group-hover:scale-105 transition transform mb-3" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <defs>
                        <linearGradient id="brandGradientNav" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#818CF8" />
                            <stop offset="100%" stop-color="#6EE7B7" />
                        </linearGradient>
                    </defs>
                    <g transform="translate(24, 24) rotate(-15) translate(-24, -24)">
                        <rect x="6" y="14" width="36" height="20" rx="3" fill="#0F172A" stroke="#6EE7B7" stroke-width="1.5" opacity="0.8"/>
                        <circle cx="24" cy="24" r="4" stroke="#6EE7B7" stroke-width="1.5"/>
                        <line x1="12" y1="24" x2="16" y2="24" stroke="#6EE7B7" stroke-width="1.5"/>
                        <line x1="32" y1="24" x2="36" y2="24" stroke="#6EE7B7" stroke-width="1.5"/>
                    </g>
                    <g transform="translate(24, 24) rotate(0) translate(-24, -24)">
                        <rect x="6" y="14" width="36" height="20" rx="3" fill="#0F172A" stroke="#818CF8" stroke-width="1.5" opacity="0.9"/>
                        <circle cx="24" cy="24" r="4" stroke="#818CF8" stroke-width="1.5"/>
                        <line x1="12" y1="24" x2="16" y2="24" stroke="#818CF8" stroke-width="1.5"/>
                        <line x1="32" y1="24" x2="36" y2="24" stroke="#818CF8" stroke-width="1.5"/>
                    </g>
                    <g transform="translate(24, 24) rotate(15) translate(-24, -24)">
                        <rect x="6" y="14" width="36" height="20" rx="3" fill="#0F172A" stroke="#FCD34D" stroke-width="1.5" opacity="0.9"/>
                        <circle cx="24" cy="24" r="4" stroke="#FCD34D" stroke-width="1.5"/>
                        <line x1="12" y1="24" x2="16" y2="24" stroke="#FCD34D" stroke-width="1.5"/>
                        <line x1="32" y1="24" x2="36" y2="24" stroke="#FCD34D" stroke-width="1.5"/>
                    </g>
                    <g transform="translate(6, 6) scale(1.5)">
                        <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3" fill="url(#brandGradientNav)" stroke="#0F172A" stroke-width="1"/>
                    </g>
                </svg>
                <div class="flex items-center gap-2">
                    <span class="font-bangla font-bold text-3xl tracking-wide gradient-text leading-none mt-1">জহুরী</span>
                </div>
                <p class="text-sm text-gray-400 mt-2">Welcome back to Johuri.ai</p>
            </a>
        </div>

        <div class="flex bg-navy-800/80 rounded-full p-1 mb-8 border border-white/5">
            <button id="tab-creator" onclick="switchRole('CREATOR')" class="flex-1 py-2 text-sm font-bold rounded-full transition bg-pastel-indigo text-navy-900 shadow-md">Content Creator</button>
            <button id="tab-brand" onclick="switchRole('BRAND')" class="flex-1 py-2 text-sm font-bold rounded-full transition text-gray-400 hover:text-white">Brand / Sponsor</button>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-5">
                <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Email Address</label>
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-pastel-indigo" size="18"></i>
                    <input type="email" id="email" required placeholder="Enter your email" class="w-full bg-navy-800 border border-white/10 rounded-xl py-3 pl-12 pr-4 text-white focus:outline-none focus:border-pastel-indigo focus:ring-1 focus:ring-pastel-indigo transition">
                </div>
            </div>

            <div class="mb-8">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider">Password</label>
                    <a href="#" class="text-xs text-pastel-mint hover:underline">Forgot?</a>
                </div>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-4 top-1/2 transform -translate-y-1/2 text-pastel-indigo" size="18"></i>
                    <input type="password" id="password" required placeholder="Enter your password" class="w-full bg-navy-800 border border-white/10 rounded-xl py-3 pl-12 pr-4 text-white focus:outline-none focus:border-pastel-indigo focus:ring-1 focus:ring-pastel-indigo transition">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-pastel-indigo to-pastel-mint text-navy-900 py-3.5 rounded-xl font-bold text-lg hover:shadow-[0_0_20px_rgba(129,140,248,0.5)] transition transform hover:-translate-y-0.5 flex justify-center items-center gap-2">
                Sign In <i data-lucide="arrow-right" size="18"></i>
            </button>
        </form>

        <p class="text-center text-sm text-gray-400 mt-6">
            Don't have an account? <a href="#" class="text-pastel-amber hover:underline font-semibold">Sign up</a>
        </p>
    </div>

    <script>
        lucide.createIcons();
        let currentRole = 'CREATOR';

        function switchRole(role) {
            currentRole = role;
            const tabCreator = document.getElementById('tab-creator');
            const tabBrand = document.getElementById('tab-brand');

            if (role === 'CREATOR') {
                tabCreator.className = 'flex-1 py-2 text-sm font-bold rounded-full transition bg-pastel-indigo text-navy-900 shadow-md';
                tabBrand.className = 'flex-1 py-2 text-sm font-bold rounded-full transition text-gray-400 hover:text-white';
            } else {
                tabBrand.className = 'flex-1 py-2 text-sm font-bold rounded-full transition bg-pastel-mint text-navy-900 shadow-md';
                tabCreator.className = 'flex-1 py-2 text-sm font-bold rounded-full transition text-gray-400 hover:text-white';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = `<i data-lucide="loader-2" class="animate-spin" size="18"></i> Authenticating...`;
            btn.disabled = true;
            lucide.createIcons();

            try {
                // Try actual backend if running
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, role: currentRole })
                });

                if (response.ok) {
                    const data = await response.json();
                    // Force selected role for demo purposes if backend didn't override
                    data.role = currentRole;
                    localStorage.setItem('johuri_user', JSON.stringify(data));
                } else {
                    // Fallback mock login
                    const mockUser = {
                        id: 'mock-123',
                        name: email.split('@')[0],
                        email: email,
                        role: currentRole
                    };
                    localStorage.setItem('johuri_user', JSON.stringify(mockUser));
                }
            } catch (error) {
                // Fallback if API completely unreachable
                const mockUser = {
                    id: 'mock-123',
                    name: email.split('@')[0],
                    email: email,
                    role: currentRole
                };
                localStorage.setItem('johuri_user', JSON.stringify(mockUser));
            }

            // Redirect based on role
            setTimeout(() => {
                if (currentRole === 'CREATOR') {
                    window.location.href = 'creator-dashboard.html';
                } else {
                    window.location.href = 'brand-dashboard.html';
                }
            }, 500);
        }
    </script>
<script src="auth.js"></script></body>
</html>
