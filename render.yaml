services:
  - type: web
    name: johuri-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_MONGODB_URI
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://johuri.onrender.com,http://localhost:3000
